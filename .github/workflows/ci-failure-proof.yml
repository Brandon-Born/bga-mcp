name: CI failure proof

on:
  push:
    branches: [verification/bga-005-failing-gates]

concurrency:
  group: ci-failure-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expected-failure:
    name: Expected gate failure / Ubuntu / Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run complete local gate and fail at the seeded check
        run: pnpm check
