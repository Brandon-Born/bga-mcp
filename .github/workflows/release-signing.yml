name: Sign retained release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-signing-v1.0.0-rc.6
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify signing implementation without signing identity
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm check
      - name: Fetch and validate the reviewed original archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/release-signing.ts prepare "$RUNNER_TEMP/prepared"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared/candidate.zip
          if-no-files-found: error
          retention-days: 7

  sign:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/prepared
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Independently recheck original archive and produce retention predicate
        run: |
          node --experimental-strip-types scripts/release-signing.ts extract "$RUNNER_TEMP/prepared/candidate.zip" "$RUNNER_TEMP/candidate"
          node --experimental-strip-types scripts/release-signing.ts predicate "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/release-provenance.json"
      - name: Attest original bytes with short-lived identity
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/candidate/*
          predicate-type: https://github.com/Brandon-Born/bga-mcp/predicates/release-candidate/v1
          predicate-path: ${{ runner.temp }}/release-provenance.json
          push-to-registry: false
          create-storage-record: false
      - name: Retain signature alongside unchanged original files
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" "$RUNNER_TEMP/candidate/sigstore-bundle.json"
          cp "$RUNNER_TEMP/release-provenance.json" "$RUNNER_TEMP/candidate/release-provenance.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  verify:
    if: github.ref == 'refs/heads/main'
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/signed-candidate
      - name: Verify signatures, refusal controls, and fresh installed public command
        env:
          GH_TOKEN: ${{ github.token }}
          BGA_MCP_SIGNED_CANDIDATE: ${{ runner.temp }}/signed-candidate
          BGA_MCP_SIGNER_COMMIT: ${{ github.sha }}
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm verify:signed-release
      - name: Scan retained result
        id: safety
        if: always()
        run: pnpm verify:safety-gates
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.safety.outcome == 'success'
        with:
          name: signed-candidate-verification-${{ github.run_id }}
          path: .artifacts/signed-release-verification.json
          if-no-files-found: warn
          retention-days: 90
