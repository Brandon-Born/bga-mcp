name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v1.0.0-rc.N tag to build without publishing
        required: true
        type: string

concurrency:
  group: release-candidate-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Build immutable candidate / Ubuntu / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Enable pinned package manager
        run: corepack enable
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify one non-publishing candidate
        env:
          BGA_MCP_CANDIDATE_TAG: ${{ inputs.tag }}
          BGA_MCP_CANDIDATE_OUTPUT: ${{ runner.temp }}/bga-mcp-release-candidate
        run: pnpm release:candidate
      - name: Retain the original candidate bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bga-mcp-release-candidate-${{ inputs.tag }}
          path: ${{ runner.temp }}/bga-mcp-release-candidate
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
